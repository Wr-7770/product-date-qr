<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة المنتجات</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 540px;
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    font-size: 36px;
    margin: 0 0 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 18px;
    margin-bottom: 30px;
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin: 18px 0 8px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 17px;
    background: #fff;
}

input:focus {
    outline: none;
    border-color: #222;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.99);
}

.error {
    display: none;
    margin-top: 18px;
    padding: 16px;
    border-radius: 12px;
    background: #ffe7e7;
    color: #b00020;
    font-size: 17px;
    font-weight: bold;
    line-height: 1.6;
}

.success {
    display: none;
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid #eee;
}

.success h2 {
    text-align: center;
    margin-bottom: 20px;
}

.url-box {
    background: #f2f2f2;
    padding: 14px;
    border-radius: 10px;
    direction: ltr;
    text-align: left;
    word-break: break-all;
    font-size: 14px;
}

#qr {
    display: block;
    width: 250px;
    height: 250px;
    margin: 25px auto;
}

.copy-btn {
    background: #eee;
    color: #222;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>إدارة المنتجات</h1>

<div class="subtitle">
إنشاء رابط وQR للمنتج
</div>


<label for="name">
اسم المنتج
</label>

<input
    id="name"
    type="text"
    placeholder="مثال: بيض"
>


<label for="production">
تاريخ الإنتاج
</label>

<input
    id="production"
    type="date"
>


<label for="expiry">
تاريخ الانتهاء
</label>

<input
    id="expiry"
    type="date"
>


<label for="lot">
رقم التشغيلة
</label>

<input
    id="lot"
    type="text"
    placeholder="مثال: LOT-123"
>


<div id="error" class="error"></div>


<button onclick="createProduct()">
إنشاء المنتج
</button>


<div id="success" class="success">

<h2>
تم إنشاء المنتج ✅
</h2>

<p>
رابط المنتج:
</p>

<div id="url" class="url-box"></div>


<img
    id="qr"
    alt="QR Code"
>


<button
    class="copy-btn"
    onclick="copyUrl()"
>
نسخ الرابط
</button>

</div>

</div>

</div>


<script>

/* =========================================
   إنشاء المنتج
========================================= */

function createProduct() {

    const name =
        document.getElementById("name").value.trim();

    const production =
        document.getElementById("production").value;

    const expiry =
        document.getElementById("expiry").value;

    const lot =
        document.getElementById("lot").value.trim();

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");


    /* إخفاء النتائج القديمة */

    error.style.display = "none";
    success.style.display = "none";


    /* =========================================
       1 - اسم المنتج فارغ
    ========================================= */

    if (!name) {

        showError(
            "يرجى كتابة اسم المنتج."
        );

        return;
    }


    /* =========================================
       2 - تاريخ الإنتاج فارغ
    ========================================= */

    if (!production) {

        showError(
            "يرجى اختيار تاريخ الإنتاج."
        );

        return;
    }


    /* =========================================
       3 - تاريخ الانتهاء فارغ
    ========================================= */

    if (!expiry) {

        showError(
            "يرجى اختيار تاريخ الانتهاء."
        );

        return;
    }


    /* =========================================
       4 - رقم التشغيلة فارغ
    ========================================= */

    if (!lot) {

        showError(
            "يرجى كتابة رقم التشغيلة."
        );

        return;
    }


    /* تحويل التواريخ */

    const productionDate =
        new Date(production + "T00:00:00");

    const expiryDate =
        new Date(expiry + "T00:00:00");


    /* تاريخ اليوم */

    const today =
        new Date();

    today.setHours(0, 0, 0, 0);


    /* =========================================
       5 - تاريخ الإنتاج في المستقبل
    ========================================= */

    if (productionDate > today) {

        showError(
            "خطأ: تاريخ الإنتاج لا يمكن أن يكون في المستقبل."
        );

        return;
    }


    /* =========================================
       6 - تاريخ الانتهاء قبل الإنتاج
    ========================================= */

    if (expiryDate < productionDate) {

        showError(
            "خطأ: تاريخ الانتهاء لا يمكن أن يكون قبل تاريخ الإنتاج."
        );

        return;
    }


    /* =========================================
       7 - كل شيء صحيح
    ========================================= */

    const baseUrl =
        window.location.origin +
        window.location.pathname.replace(
            "admin.html",
            ""
        );


    const productUrl =
        baseUrl +
        "?name=" + encodeURIComponent(name) +
        "&production=" + encodeURIComponent(production) +
        "&expiry=" + encodeURIComponent(expiry) +
        "&lot=" + encodeURIComponent(lot);


    /* عرض الرابط */

    document.getElementById("url").textContent =
        productUrl;


    /* إنشاء QR */

    const qrUrl =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=300x300&data=" +
        encodeURIComponent(productUrl);


    document.getElementById("qr").src =
        qrUrl;


    /* إظهار النتيجة */

    success.style.display =
        "block";

}


/* =========================================
   عرض الخطأ
========================================= */

function showError(message) {

    const error =
        document.getElementById("error");

    error.textContent =
        "⚠️ " + message;

    error.style.display =
        "block";
}


/* =========================================
   نسخ الرابط
========================================= */

function copyUrl() {

    const url =
        document.getElementById("url").textContent;

    navigator.clipboard.writeText(url)
        .then(function() {

            alert("تم نسخ الرابط ✅");

        })
        .catch(function() {

            alert("لم يتم نسخ الرابط تلقائيًا.");

        });

}

</script>

</body>
</html>
