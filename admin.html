
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المنتجات</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
.container{max-width:700px;margin:22px auto}
.card{background:#fff;padding:23px;border-radius:14px;box-shadow:0 4px 18px #00000008;margin-bottom:18px}
h1{font-size:25px;margin:0 0 8px}
h2{font-size:20px;margin:0 0 16px}
.subtitle{color:#777;margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:16px}
label{display:block;font-weight:bold;margin-bottom:8px;font-size:14px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;background:#fff;color:#222}
input:focus{outline:2px solid #b8d4ff;border-color:#4385f5}
button,.btn{border:0;border-radius:8px;padding:11px 15px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.primary{background:#2463eb;color:#fff}
.secondary{background:#eee;color:#222}
.danger{background:#fee2e2;color:#b91c1c}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#message{margin-top:14px;padding:12px;border-radius:8px;display:none;overflow-wrap:anywhere}
#result{display:none;margin-top:22px;border-top:1px solid #eee;padding-top:22px}
.linkbox{padding:12px;background:#f5f5f5;border-radius:8px;overflow-wrap:anywhere;direction:ltr;text-align:left;font-size:13px}

/* بطاقة QR البيضاء */
.qr-area{display:flex;justify-content:center;align-items:center;margin:24px auto 18px}
.qr-frame{
 width:220px;height:220px;max-width:100%;
 background:#fff;border:1px solid #e5e7eb;border-radius:12px;
 box-shadow:0 4px 16px rgba(0,0,0,.07);
 display:flex;justify-content:center;align-items:center;
 padding:18px;
}
#qr{display:block;width:100%;height:100%;object-fit:contain}
.qr-caption{text-align:center;color:#777;font-size:13px;margin:0 0 16px}

.record{padding:16px 0;border-bottom:1px solid #eee}
.record-title{font-weight:bold;font-size:17px}
.record-meta{color:#666;font-size:13px;line-height:1.9;margin-top:7px;overflow-wrap:anywhere}
.badge{display:inline-block;border-radius:6px;padding:5px 8px;font-size:12px;margin-top:8px}
.empty{color:#777;text-align:center;padding:25px 5px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:#777}
@media(max-width:520px){
 body{padding:12px}.container{margin:10px auto}.card{padding:18px}
 .grid{grid-template-columns:1fr}h1{font-size:23px}
 .qr-frame{width:210px;height:210px;padding:17px}
}
</style>
</head>
<body>
<div class="container">

<section class="card">
<h1>إدارة المنتجات</h1>
<p class="subtitle">إنشاء رابط و QR للمنتج</p>

<form id="productForm">
<div class="field">
<label for="name">اسم المنتج</label>
<input id="name" maxlength="120" placeholder="مثال: بيض" required>
</div>

<div class="grid">
<div class="field">
<label for="production">تاريخ الإنتاج</label>
<input id="production" type="date" required>
</div>
<div class="field">
<label for="expiry">تاريخ الانتهاء</label>
<input id="expiry" type="date" required>
</div>
</div>

<div class="field">
<label for="lot">رقم التشغيلة</label>
<input id="lot" maxlength="80" placeholder="مثال: LOT-123" required>
</div>

<div class="actions">
<button class="primary" id="saveButton" type="submit">إنشاء المنتج</button>
<button class="secondary" id="cancelEdit" type="button" hidden>إلغاء التعديل</button>
</div>
</form>

<div id="message" role="status"></div>

<div id="result">
<h2>تم إنشاء المنتج ✓</h2>
<p>رابط المنتج:</p>
<div class="linkbox" id="productLink"></div>

<div class="qr-area">
<div class="qr-frame">
<img id="qr" alt="رمز QR للمنتج">
</div>
</div>
<p class="qr-caption">امسح الرمز للوصول إلى صفحة المنتج</p>

<div class="actions">
<button class="secondary" id="copyLink" type="button">نسخ الرابط</button>
<a class="btn primary" id="openProduct" target="_blank" rel="noopener">فتح صفحة المنتج</a>
<a class="btn secondary" id="downloadQR" download="product-qr.png">تنزيل QR</a>
</div>
</div>
</section>

<section class="card">
<div class="topline">
<h2>سجل المنتجات</h2>
<button class="danger" id="clearHistory" type="button">حذف السجل</button>
</div>
<p class="small">المنتجات المحفوظة في هذا المتصفح.</p>
<div id="history"></div>
</section>

</div>

<script>
(function(){
"use strict";
const KEY="vault_product_records_v1";
const $=id=>document.getElementById(id);
const form=$("productForm");
const nameInput=$("name");
const productionInput=$("production");
const expiryInput=$("expiry");
const lotInput=$("lot");
const saveButton=$("saveButton");
const cancelEdit=$("cancelEdit");
const message=$("message");
const result=$("result");
const history=$("history");
let editingId=null;
let currentLink="";

function loadRecords(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY)||"[]");
  return Array.isArray(data)?data:[];
 }catch{return [];}
}
function storeRecords(records){
 try{
  localStorage.setItem(KEY,JSON.stringify(records));
  return true;
 }catch{
  showMessage("تعذّر حفظ السجل في المتصفح.",true);
  return false;
 }
}
function showMessage(text,error=false){
 message.textContent=text;
 message.style.display="block";
 message.style.background=error?"#fee2e2":"#dcfce7";
 message.style.color=error?"#991b1b":"#166534";
}
function hideMessage(){message.style.display="none";}

function validDate(value){
 if(!value)return false;
 const p=value.split("-");
 if(p.length!==3)return false;
 const y=Number(p[0]),m=Number(p[1]),d=Number(p[2]);
 if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d))return false;
 const date=new Date(0);
 date.setHours(12,0,0,0);
 date.setFullYear(y,m-1,d);
 return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d;
}
function todayString(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function validate(p){
 if(!p.name.trim()||!p.production||!p.expiry||!p.lot.trim())return "يرجى تعبئة جميع الحقول.";
 if(!validDate(p.production)||!validDate(p.expiry))return "يرجى إدخال تواريخ صحيحة.";
 if(p.production>todayString())return "تاريخ الإنتاج لا يمكن أن يكون في المستقبل.";
 if(p.expiry<p.production)return "تاريخ الانتهاء لا يمكن أن يكون قبل تاريخ الإنتاج.";
 return "";
}
function productUrl(p){
 const url=new URL("index.html",location.href);
 url.search=new URLSearchParams({name:p.name,production:p.production,expiry:p.expiry,lot:p.lot}).toString();
 return url.href;
}
function showResult(p){
 currentLink=productUrl(p);
 $("productLink").textContent=currentLink;
 $("openProduct").href=currentLink;
 const qr="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=2&color=000000&bgcolor=ffffff&data="+encodeURIComponent(currentLink);
 $("qr").src=qr;
 $("downloadQR").href=qr;
 result.style.display="block";
}
function resetForm(){
 form.reset();editingId=null;
 saveButton.textContent="إنشاء المنتج";
 cancelEdit.hidden=true;
}
async function copyText(text){
 try{
  await navigator.clipboard.writeText(text);
  showMessage("تم نسخ الرابط.");
 }catch{window.prompt("انسخ الرابط:",text);}
}
function makeButton(text,cls,fn){
 const b=document.createElement("button");
 b.type="button";b.className=cls;b.textContent=text;b.addEventListener("click",fn);
 return b;
}
function renderHistory(){
 const records=loadRecords().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 history.replaceChildren();
 if(!records.length){
  const empty=document.createElement("div");
  empty.className="empty";empty.textContent="لا توجد منتجات محفوظة حتى الآن.";
  history.appendChild(empty);return;
 }
 records.forEach(p=>{
  const item=document.createElement("div");item.className="record";
  const title=document.createElement("div");title.className="record-title";title.textContent=p.name;
  const meta=document.createElement("div");meta.className="record-meta";
  meta.textContent="الإنتاج: "+p.production+" | الانتهاء: "+p.expiry+" | التشغيلة: "+p.lot;
  const badge=document.createElement("span");badge.className="badge";
  const expired=p.expiry<todayString();
  badge.textContent=expired?"🔴 منتهي الصلاحية":"🟢 صالح";
  badge.style.background=expired?"#fee2e2":"#dcfce7";
  const actions=document.createElement("div");actions.className="actions";
  actions.appendChild(makeButton("فتح صفحة المنتج","primary",()=>window.open(productUrl(p),"_blank","noopener")));
  actions.appendChild(makeButton("نسخ الرابط","secondary",()=>copyText(productUrl(p))));
  actions.appendChild(makeButton("تعديل","secondary",()=>{
   editingId=p.id;nameInput.value=p.name;productionInput.value=p.production;
   expiryInput.value=p.expiry;lotInput.value=p.lot;
   saveButton.textContent="حفظ التعديلات";cancelEdit.hidden=false;
   hideMessage();result.style.display="none";window.scrollTo({top:0,behavior:"smooth"});
  }));
  actions.appendChild(makeButton("حذف","danger",()=>{
   if(!confirm("هل تريد حذف المنتج «"+p.name+"» من السجل؟"))return;
   if(storeRecords(loadRecords().filter(x=>x.id!==p.id))){
    if(editingId===p.id)resetForm();
    renderHistory();showMessage("تم حذف المنتج من السجل.");
   }
  }));
  item.append(title,meta,badge,actions);history.appendChild(item);
 });
}
form.addEventListener("submit",e=>{
 e.preventDefault();hideMessage();
 const p={name:nameInput.value.trim(),production:productionInput.value,expiry:expiryInput.value,lot:lotInput.value.trim()};
 const error=validate(p);
 if(error){showMessage(error,true);return;}
 const records=loadRecords(),now=Date.now();
 if(editingId){
  const i=records.findIndex(x=>x.id===editingId);
  if(i<0){showMessage("لم يتم العثور على المنتج في السجل.",true);return;}
  records[i]={...records[i],...p,updatedAt:now};
 }else{
  records.push({...p,id:(crypto.randomUUID?crypto.randomUUID():String(now)+Math.random()),createdAt:now,updatedAt:now});
 }
 if(!storeRecords(records))return;
 showResult(p);renderHistory();
 showMessage(editingId?"تم حفظ تعديلات المنتج.":"تم إنشاء المنتج وحفظه في السجل.");
 resetForm();result.style.display="block";
});
cancelEdit.addEventListener("click",()=>{resetForm();hideMessage();});
$("copyLink").addEventListener("click",()=>{if(currentLink)copyText(currentLink);});
$("clearHistory").addEventListener("click",()=>{
 if(!confirm("هل تريد حذف جميع المنتجات المحفوظة في هذا المتصفح؟"))return;
 if(storeRecords([])){
  resetForm();result.style.display="none";renderHistory();showMessage("تم حذف سجل المنتجات.");
 }
});
renderHistory();
})();
</script>
</body>
</html>
