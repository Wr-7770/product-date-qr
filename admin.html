<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة المنتجات</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 28px;
    margin-bottom: 25px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin: 16px 0 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 11px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    border: 0;
    border-radius: 11px;
    background: #222;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 14px;
    border-radius: 11px;
    background: #ffe5e5;
    color: #b00020;
    font-weight: bold;
    line-height: 1.6;
}

.success {
    display: none;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.url {
    direction: ltr;
    text-align: left;
    word-break: break-all;
    background: #f2f2f2;
    padding: 12px;
    border-radius: 10px;
}

#qr {
    display: block;
    width: 230px;
    height: 230px;
    margin: 20px auto;
}

.copy {
    background: #eee;
    color: #222;
}

.clear {
    background: #b00020;
}

.products-title {
    font-size: 27px;
    margin-top: 0;
}

.product {
    border: 1px solid #eee;
    border-radius: 15px;
    padding: 18px;
    margin-top: 15px;
    background: #fafafa;
}

.product-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
}

.product-row {
    margin: 7px 0;
    color: #555;
}

.status {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    font-weight: bold;
    margin-top: 8px;
}

.valid {
    background: #e3f6e3;
    color: #168316;
}

.expired {
    background: #ffe3e3;
    color: #c00000;
}

.product-link {
    display: block;
    margin-top: 12px;
    color: #1769aa;
    word-break: break-all;
    direction: ltr;
    text-align: left;
}

.empty {
    text-align: center;
    color: #777;
    padding: 25px;
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     إنشاء منتج
========================= -->

<div class="card">

<h1>إدارة المنتجات</h1>

<div class="subtitle">
إنشاء رابط وQR للمنتج
</div>

<label for="name">اسم المنتج</label>

<input
    id="name"
    type="text"
    placeholder="مثال: بيض"
>


<label for="production">تاريخ الإنتاج</label>

<input
    id="production"
    type="date"
>


<label for="expiry">تاريخ الانتهاء</label>

<input
    id="expiry"
    type="date"
>


<label for="lot">رقم التشغيلة</label>

<input
    id="lot"
    type="text"
    placeholder="مثال: LOT-123"
>


<div id="error" class="error"></div>

<button onclick="createProduct()">
إنشاء المنتج
</button>


<div id="success" class="success">

<h2>تم إنشاء المنتج ✅</h2>

<p>رابط المنتج:</p>

<div id="url" class="url"></div>

<img id="qr" alt="QR Code">

<button class="copy" onclick="copyUrl()">
نسخ الرابط
</button>

</div>

</div>


<!-- =========================
     سجل المنتجات
========================= -->

<div class="card">

<h2 class="products-title">
سجل المنتجات
</h2>

<div id="productsList"></div>

<button class="clear" onclick="clearProducts()">
مسح سجل المنتجات
</button>

</div>

</div>


<script>

/* =========================================
   تحميل المنتجات
========================================= */

let products =
    JSON.parse(
        localStorage.getItem("products") || "[]"
    );


/* =========================================
   إنشاء منتج
========================================= */

function createProduct() {

    const name =
        document.getElementById("name").value.trim();

    const production =
        document.getElementById("production").value;

    const expiry =
        document.getElementById("expiry").value;

    const lot =
        document.getElementById("lot").value.trim();

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");


    error.style.display = "none";
    success.style.display = "none";


    /* اسم المنتج */

    if (!name) {
        showError("يرجى كتابة اسم المنتج.");
        return;
    }


    /* تاريخ الإنتاج */

    if (!production) {
        showError("يرجى اختيار تاريخ الإنتاج.");
        return;
    }


    /* تاريخ الانتهاء */

    if (!expiry) {
        showError("يرجى اختيار تاريخ الانتهاء.");
        return;
    }


    /* رقم التشغيلة */

    if (!lot) {
        showError("يرجى كتابة رقم التشغيلة.");
        return;
    }


    const productionDate =
        new Date(production + "T00:00:00");

    const expiryDate =
        new Date(expiry + "T00:00:00");


    const today = new Date();

    today.setHours(0, 0, 0, 0);


    /* الإنتاج في المستقبل */

    if (productionDate > today) {

        showError(
            "تاريخ الإنتاج لا يمكن أن يكون في المستقبل."
        );

        return;
    }


    /* الانتهاء قبل الإنتاج */

    if (expiryDate < productionDate) {

        showError(
            "تاريخ الانتهاء لا يمكن أن يكون قبل تاريخ الإنتاج."
        );

        return;
    }


    /* منع تكرار رقم التشغيلة */

    const duplicate =
        products.some(
            product => product.lot.toLowerCase() === lot.toLowerCase()
        );

    if (duplicate) {

        showError(
            "رقم التشغيلة موجود بالفعل. استخدم رقمًا مختلفًا."
        );

        return;
    }


    /* =========================================
       إنشاء معرف فريد
    ========================================= */

    const id =
        "P-" +
        Date.now().toString(36).toUpperCase();


    /* =========================================
       إنشاء رابط المنتج
    ========================================= */

    const baseUrl =
        window.location.origin +
        window.location.pathname.replace(
            "admin.html",
            ""
        );


    const productUrl =
        baseUrl +
        "?id=" + encodeURIComponent(id) +
        "&name=" + encodeURIComponent(name) +
        "&production=" + encodeURIComponent(production) +
        "&expiry=" + encodeURIComponent(expiry) +
        "&lot=" + encodeURIComponent(lot);


    /* =========================================
       حفظ المنتج
    ========================================= */

    const product = {

        id: id,

        name: name,

        production: production,

        expiry: expiry,

        lot: lot,

        url: productUrl,

        createdAt:
            new Date().toISOString()
    };


    products.unshift(product);


    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );


    /* =========================================
       عرض الرابط
    ========================================= */

    document.getElementById("url").textContent =
        productUrl;


    /* =========================================
       QR
    ========================================= */

    document.getElementById("qr").src =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=300x300&data=" +
        encodeURIComponent(productUrl);


    success.style.display = "block";


    /* تحديث السجل */

    renderProducts();


    /* تنظيف الحقول */

    document.getElementById("name").value = "";
    document.getElementById("production").value = "";
    document.getElementById("expiry").value = "";
    document.getElementById("lot").value = "";
}


/* =========================================
   عرض الخطأ
========================================= */

function showError(message) {

    const error =
        document.getElementById("error");

    error.textContent =
        "⚠️ " + message;

    error.style.display = "block";
}


/* =========================================
   معرفة حالة المنتج
========================================= */

function getStatus(expiry) {

    const today = new Date();

    today.setHours(0, 0, 0, 0);

    const expiryDate =
        new Date(expiry + "T23:59:59");

    if (expiryDate < today) {

        return {
            text: "🔴 منتهي الصلاحية",
            className: "expired"
        };

    }

    return {
        text: "🟢 المنتج صالح",
        className: "valid"
    };
}


/* =========================================
   عرض سجل المنتجات
========================================= */

function renderProducts() {

    const list =
        document.getElementById("productsList");


    if (products.length === 0) {

        list.innerHTML =
            '<div class="empty">' +
            'لا توجد منتجات حتى الآن.' +
            '</div>';

        return;
    }


    list.innerHTML = "";


    products.forEach(function(product) {

        const status =
            getStatus(product.expiry);


        const div =
            document.createElement("div");

        div.className = "product";


        div.innerHTML = `

            <div class="product-name">
                ${escapeHtml(product.name)}
            </div>

            <div class="product-row">
                <b>رقم التشغيلة:</b>
                ${escapeHtml(product.lot)}
            </div>

            <div class="product-row">
                <b>الإنتاج:</b>
                ${product.production}
            </div>

            <div class="product-row">
                <b>الانتهاء:</b>
                ${product.expiry}
            </div>

            <div class="status ${status.className}">
                ${status.text}
            </div>

            <a
                class="product-link"
                href="${product.url}"
                target="_blank"
            >
                فتح صفحة المنتج
            </a>
        `;


        list.appendChild(div);

    });
}


/* =========================================
   حماية النصوص
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================
   نسخ الرابط
========================================= */

function copyUrl() {

    const url =
        document.getElementById("url").textContent;

    navigator.clipboard.writeText(url)
        .then(function() {

            alert("تم نسخ الرابط ✅");

        })
        .catch(function() {

            alert("تعذر نسخ الرابط.");

        });
}


/* =========================================
   مسح السجل
========================================= */

function clearProducts() {

    if (
        !confirm(
            "هل أنت متأكد من مسح سجل المنتجات؟"
        )
    ) {
        return;
    }


    products = [];

    localStorage.removeItem("products");

    renderProducts();
}


/* =========================================
   تشغيل السجل عند فتح الصفحة
========================================= */

renderProducts();

</script>

</body>
</html>
