
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المنتجات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#222;font-family:Arial,sans-serif}
.container{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:520px;background:white;border-radius:20px;padding:26px;box-shadow:0 8px 28px #00000010}
h1{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#666;margin:0 0 24px}
label{display:block;font-weight:bold;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:white}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#222;color:white;font-size:17px;font-weight:bold;margin-top:20px;cursor:pointer}
.message{display:none;padding:12px;border-radius:10px;margin-top:15px;background:#ffe8e8;color:#a00}
.result{display:none;margin-top:24px;border-top:1px solid #eee;padding-top:20px}
.url{direction:ltr;text-align:left;overflow-wrap:anywhere;background:#f4f4f4;padding:12px;border-radius:10px}
#qr{display:block;width:240px;height:240px;max-width:100%;object-fit:contain;margin:18px auto}
.secondary{background:#eee;color:#222}
</style>
</head>
<body>
<main class="container">
<section class="card">
<h1>إدارة المنتجات</h1>
<p class="sub">إنشاء رابط و QR للمنتج</p>

<form id="form">
<label for="name">اسم المنتج</label>
<input id="name" maxlength="100" placeholder="مثال: بيض" required>

<label for="production">تاريخ الإنتاج</label>
<input id="production" type="date" required>

<label for="expiry">تاريخ الانتهاء</label>
<input id="expiry" type="date" required>

<label for="lot">رقم التشغيلة</label>
<input id="lot" maxlength="60" placeholder="مثال: LOT-132" required>

<div id="message" class="message" role="alert"></div>
<button type="submit">إنشاء المنتج</button>
</form>

<div id="result" class="result">
<h2>تم إنشاء المنتج ✓</h2>
<p>رابط المنتج:</p>
<div id="url" class="url"></div>
<img id="qr" alt="رمز QR للمنتج">
<button id="copy" class="secondary" type="button">نسخ الرابط</button>
<a id="open" href="#" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:18px">فتح صفحة المنتج</a>
</div>
</section>
</main>

<script>
const form = document.getElementById("form");
const message = document.getElementById("message");
const result = document.getElementById("result");
const today = new Date();
today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
const todayString = today.toISOString().slice(0,10);
document.getElementById("production").max = todayString;

form.addEventListener("submit", function(event) {
  event.preventDefault();
  message.style.display = "none";
  result.style.display = "none";

  const name = document.getElementById("name").value.trim();
  const production = document.getElementById("production").value;
  const expiry = document.getElementById("expiry").value;
  const lot = document.getElementById("lot").value.trim();

  let error = "";
  if (!name || !production || !expiry || !lot) {
    error = "أكمل جميع بيانات المنتج.";
  } else if (production > todayString) {
    error = "تاريخ الإنتاج لا يمكن أن يكون في المستقبل.";
  } else if (expiry < production) {
    error = "تاريخ الانتهاء لا يمكن أن يكون قبل تاريخ الإنتاج.";
  }

  if (error) {
    message.textContent = "⚠️ " + error;
    message.style.display = "block";
    return;
  }

  const page = new URL("index.html", window.location.href);
  page.searchParams.set("name", name);
  page.searchParams.set("production", production);
  page.searchParams.set("expiry", expiry);
  page.searchParams.set("lot", lot);

  const productUrl = page.href;
  document.getElementById("url").textContent = productUrl;
  document.getElementById("open").href = productUrl;
  document.getElementById("qr").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(productUrl);

  result.style.display = "block";
});

document.getElementById("copy").addEventListener("click", async function() {
  const url = document.getElementById("url").textContent;
  try {
    await navigator.clipboard.writeText(url);
    this.textContent = "تم نسخ الرابط ✓";
  } catch {
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("url"));
    selection.removeAllRanges();
    selection.addRange(range);
    this.textContent = "حدد الرابط وانسخه";
  }
});
</script>
</body>
</html>
