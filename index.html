<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معلومات المنتج</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    .card {
      max-width: 520px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 14px #00000010;
    }
    h2 { margin-top: 0; }
    .subtitle { color: #666; margin-bottom: 25px; }
    .item {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      overflow-wrap: anywhere;
    }
    .item strong { display: block; margin-bottom: 7px; }
    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
    }
    .valid { background: #e7f7ec; color: #16803d; }
    .expired { background: #fdeaea; color: #c62828; }
    .error { background: #fff3d6; color: #875c00; }
  </style>
</head>
<body>
  <main class="card">
    <h2>معلومات المنتج</h2>
    <p class="subtitle">تحقق من تاريخ إنتاج وانتهاء المنتج</p>
    <div id="details"></div>
    <div id="status"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const name = params.get("name") || "";
    const production = params.get("production") || "";
    const expiry = params.get("expiry") || "";
    const lot = params.get("lot") || "";

    const details = document.getElementById("details");
    const status = document.getElementById("status");

    function addItem(label, value) {
      const div = document.createElement("div");
      div.className = "item";
      const strong = document.createElement("strong");
      strong.textContent = label;
      const span = document.createElement("span");
      span.textContent = value;
      div.append(strong, span);
      details.appendChild(div);
    }

    function showStatus(message, type) {
      status.className = "status " + type;
      status.textContent = message;
    }

    if (!name || !production || !expiry || !lot) {
      showStatus("لم يتم العثور على بيانات المنتج. امسح رمز QR الصحيح.", "error");
    } else {
      addItem("اسم المنتج", name);
      addItem("تاريخ الإنتاج", production);
      addItem("تاريخ الانتهاء", expiry);
      addItem("رقم التشغيلة", lot);

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const productionDate = new Date(production + "T00:00:00");
      const expiryDate = new Date(expiry + "T00:00:00");

      if (
        isNaN(productionDate.getTime()) ||
        isNaN(expiryDate.getTime()) ||
        !/^\d{4}-\d{2}-\d{2}$/.test(production) ||
        !/^\d{4}-\d{2}-\d{2}$/.test(expiry) ||
        productionDate > today ||
        expiryDate < productionDate
      ) {
        showStatus("⚠️ تعذّر التحقق من التواريخ", "error");
      } else if (expiryDate < today) {
        showStatus("🔴 منتهي الصلاحية", "expired");
      } else {
        showStatus("🟢 صالح", "valid");
      }
    }
  </script>
</body>
</html>
