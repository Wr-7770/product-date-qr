<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحقق من صلاحية المنتج</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="icon">📦</div>
      <h1>معلومات المنتج</h1>
      <p class="subtitle">تحقق من تاريخ إنتاج وانتهاء المنتج</p>

      <div class="info">
        <div><span>المنتج</span><strong id="product">جاري التحميل...</strong></div>
        <div><span>تاريخ الإنتاج</span><strong id="production">جاري التحميل...</strong></div>
        <div><span>تاريخ الانتهاء</span><strong id="expiry">جاري التحميل...</strong></div>
        <div><span>رقم التشغيلة</span><strong id="lot">جاري التحميل...</strong></div>
      </div>

      <div id="status" class="status">جاري التحقق...</div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
